<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nota
    </title>
</head>
<body>
    <script>
        let nota1, nota2, nota3, nombreCompleto;
 
        nota1 = Number(prompt("Ingrese la primera nota: "));
        nota2 = Number(prompt("Ingrese la segunda nota: "));
        nota3 = Number(prompt("Ingrese la tercera nota: "));
        nombreCompleto = prompt("Ingrese su nombre completo: ");
 
        let promedio = (nota1*0.30) + (nota2*0.35) + (nota3*0.35);
 
        document.write("El promedio de " + nombreCompleto + " es: " + promedio);
 
    </script>
</body>
</html>
